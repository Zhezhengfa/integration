<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷你版校园信息中心</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 56px; }
    .section-title { border-left: 4px solid #0d6efd; padding-left: 10px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#home">校园信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#rooms">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="#stats">统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <section id="home" class="mb-5">
      <h2 class="section-title h4 mb-3">首页 · 校园概览</h2>
      <div class="row g-3">
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">自习室</h3>
              <p class="card-text fs-3 text-primary">—</p>
              <p class="card-text small text-muted">可用自习室数</p>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">今日使用</h3>
              <p class="card-text fs-3 text-success">—</p>
              <p class="card-text small text-muted">人次（模拟）</p>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">开放中</h3>
              <p class="card-text fs-3 text-warning">—</p>
              <p class="card-text small text-muted">当前开放自习室</p>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">三维导览</h3>
              <p class="card-text fs-3 text-info">3D</p>
              <p class="card-text small text-muted">
                <a href="three-d/scene.html" class="text-decoration-none">进入 →</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="rooms" class="mb-5">
      <h2 class="section-title h4 mb-3">自习室查询</h2>
      <div class="alert alert-secondary">
        <section id="rooms" class="mb-5">
          <h2 class="section-title h4 mb-3">自习室查询</h2>
          <div class="row g-2 mb-3">
            <div class="col-md-3">
              <label class="form-label small">按楼层</label>
              <select class="form-select form-select-sm" id="filter-floor">
                <option value="">全部楼层</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small">开放状态</label>
              <select class="form-select form-select-sm" id="filter-status">
                <option value="">全部</option>
                <option value="open">开放中</option>
                <option value="close">已关闭</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small">关键词</label>
              <input type="text" class="form-control form-select-sm" id="filter-keyword" placeholder="名称/位置">
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button class="btn btn-outline-secondary btn-sm w-100" id="btn-reset">重置筛选</button>
            </div>
          </div>
          <p class="text-muted small" id="room-count">共 0 间</p>
          <div class="row g-3" id="room-list"></div>
      </section>
      </div>
    </section>
    <section id="stats" class="mb-5">
      <h2 class="section-title h4 mb-3">使用统计</h2>
      <div class="alert alert-secondary">
        <section id="stats" class="mb-5">
          <h2 class="section-title h4 mb-3">使用统计</h2>
          <p id="status" class="alert alert-warning" style="display:none"></p>
          <p class="text-muted" id="sub-title">数据来源：校园自习室模拟数据集</p>
          <div class="row g-3">
            <div class="col-lg-6">
              <h3 class="h6">各自习室本周使用量（ECharts 柱状图）</h3>
              <div id="bar-chart" style="height:360px"></div>
            </div>  
            <div class="col-lg-6">
              <h3 class="h6">使用趋势（ECharts 折线图）</h3>
              <div id="line-chart" style="height:360px"></div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>
  <footer class="bg-light py-3 text-center text-muted small">
    迷你版校园信息中心 · 课堂案例复现
  </footer>
    <script src="libs/jquery-3.7.1.min.js"></script>
    <script src="libs/bootstrap.bundle.min.js"></script>
    <script src="libs/echarts.min.js"></script>
    <script src="app.js"></script>
</body>
</body>
</html>
