<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷你版校园信息中心</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 56px; }
    .section-title { border-left: 4px solid #0d6efd; padding-left: 10px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#home">校园信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#rooms">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="#stats">统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <section id="home" class="mb-5">
      <h2 class="section-title h4 mb-3">首页 · 校园概览</h2>
      <div class="row g-3">
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">自习室</h3>
              <p class="card-text fs-3 text-primary">—</p>
              <p class="card-text small text-muted">可用自习室数</p>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">今日使用</h3>
              <p class="card-text fs-3 text-success">—</p>
              <p class="card-text small text-muted">人次（模拟）</p>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">开放中</h3>
              <p class="card-text fs-3 text-warning">—</p>
              <p class="card-text small text-muted">当前开放自习室</p>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">三维导览</h3>
              <p class="card-text fs-3 text-info">3D</p>
              <p class="card-text small text-muted">
                <a href="three-d/scene.html" class="text-decoration-none">进入 →</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="rooms" class="mb-5">
      <h2 class="section-title h4 mb-3">自习室查询</h2>
      <div class="alert alert-secondary">
        （第二步将在此处添加自习室筛选交互，数据写死在 JS 数组，按楼层／开放状态过滤。）
      </div>
    </section>
    <section id="stats" class="mb-5">
      <h2 class="section-title h4 mb-3">使用统计</h2>
      <div class="alert alert-secondary">
        （第二步将在此处添加使用统计图表，加载 data/rooms.json 渲染各自习室使用量。）
      </div>
    </section>
  </main>
  <footer class="bg-light py-3 text-center text-muted small">
    迷你版校园信息中心 · 课堂案例复现
  </footer>
  <script src="libs/bootstrap.bundle.min.js"></script>
</body>
</html>
